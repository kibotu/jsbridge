[versions]
agp = "9.5.1"
kotlin = "2.4.21"
compileSdk = "37"
buildTools = "37"
minSdk = "24"
targetSdk = "37"
jdk = "21"
vanniktech-maven-publish = "0.37.0"

[libraries]
