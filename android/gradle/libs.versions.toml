androidx-security-crypto = { module = "androidx.security:security-crypto", version = "1.1.0" }
androidx-webkit = { module = "androidx.webkit:webkit", version = "1.18.0" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.12.0" }
